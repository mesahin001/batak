# Marketing site at the apex. API, sockets, legal pages and the APK download stay
# reachable here because the Android app and the dApp Store point at batakci.xyz.
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/ssl/cloudflare/sinav.pem;
    ssl_certificate_key /etc/ssl/cloudflare/sinav.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_name batakci.xyz www.batakci.xyz _;  # marketing site (default server)

    root /srv/batak;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    location = / {
        try_files /landing/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location ^~ /landing/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Kill-switch service worker: removes the old game SW from returning visitors
    location = /sw.js {
        try_files /landing/sw-kill.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /favicon.ico { try_files /favicon.ico =404; }
    location ^~ /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location /socket.io/ {
        proxy_pass http://batak-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
    location /health {
        proxy_pass http://batak-server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api {
        proxy_pass http://batak-server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /nft/ {
        proxy_pass http://batak-server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /legal/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /privacy.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /terms.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /download {
        alias /downloads/batak.apk;
        add_header Content-Disposition 'attachment; filename="batak.apk"';
        add_header Content-Type application/vnd.android.package-archive;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 302 https://game.batakci.xyz$request_uri;
    }
}

# Web game (SPA + API + sockets). The DNS record for game.batakci.xyz must exist in Cloudflare.
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/ssl/cloudflare/sinav.pem;
    ssl_certificate_key /etc/ssl/cloudflare/sinav.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    server_name game.batakci.xyz;  # web game

    root /srv/batak;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    location /socket.io/ {
        proxy_pass http://batak-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /health {
        proxy_pass http://batak-server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://batak-server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /nft/ {
        proxy_pass http://batak-server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /legal/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /privacy.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /terms.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /download {
        alias /downloads/batak.apk;
        add_header Content-Disposition 'attachment; filename="batak.apk"';
        add_header Content-Type application/vnd.android.package-archive;
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* /workbox-[^/]+\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* \.(webmanifest)$|manifest\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
