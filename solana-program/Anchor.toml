[toolchain]

[features]
resolution = true
skip-lint = false

[programs.devnet]
batak_tournament = "5ZdgoyBDknoZ8tDYMDXf8zCUQ7FxuaDbK4QffAgSfA9h"

[programs.localnet]
batak_tournament = "5ZdgoyBDknoZ8tDYMDXf8zCUQ7FxuaDbK4QffAgSfA9h"

# Mainnet: the old address here belonged to a deploy keypair that was published in
# this repo's history and must never be used. Generate a fresh keypair OUTSIDE the
# repo (solana-keygen new -o ~/.config/solana/batak-mainnet-program.json), put its
# address in declare_id! and here, and keep the file out of git.
# [programs.mainnet]
# batak_tournament = "<new program id>"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[hooks]
