version: '3.8'

services:
  batak-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: batak-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      - SOLANA_PRIVATE_KEY=${SOLANA_PRIVATE_KEY:-}
      - SOLANA_NETWORK=${SOLANA_NETWORK:-devnet}
      - PROGRAM_ID=${PROGRAM_ID:-}
      - MERKLE_TREE=${MERKLE_TREE:-}
      - REDIS_ENABLED=${REDIS_ENABLED:-false}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    volumes:
      - server-data:/app/data
    expose:
      - "3001"
    depends_on: []

  redis:
    image: redis:7-alpine
    container_name: batak-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    # Only enable if you want Redis (set REDIS_ENABLED=true)
    profiles:
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: batak-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=batak
      - POSTGRES_USER=${POSTGRES_USER:-batak}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    # Only enable if you want PostgreSQL (set DATABASE_TYPE=postgresql)
    profiles:
      - postgres

  nginx:
    image: nginx:alpine
    container_name: batak-nginx
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
      - ./downloads:/downloads:ro
    depends_on:
      - batak-server

volumes:
  server-data:
  redis-data:
  postgres-data:
