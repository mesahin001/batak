<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0"/>
      <stop offset="50%" style="stop-color:#A8A8A8"/>
      <stop offset="100%" style="stop-color:#C0C0C0"/>
    </linearGradient>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1020"/>
      <stop offset="100%" style="stop-color:#0a1525"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad2)"/>

  <!-- Ottoman-style border -->
  <rect x="20" y="20" width="472" height="472" fill="none" stroke="url(#silverGrad)" stroke-width="8"/>
  <rect x="30" y="30" width="452" height="452" fill="none" stroke="url(#silverGrad)" stroke-width="2"/>

  <!-- Corner decorations - Card suits -->
  <text x="50" y="60" font-size="36" fill="#C0C0C0" filter="url(#glow2)">♥</text>
  <text x="440" y="60" font-size="36" fill="#C0C0C0" filter="url(#glow2)">♦</text>
  <text x="50" y="470" font-size="36" fill="#C0C0C0" filter="url(#glow2)">♣</text>
  <text x="440" y="470" font-size="36" fill="#C0C0C0" filter="url(#glow2)">♠</text>

  <!-- Trophy/Medal icon -->
  <g transform="translate(256, 180)">
    <!-- Medal -->
    <circle cx="0" cy="20" r="45" fill="url(#silverGrad)" stroke="#808080" stroke-width="3"/>
    <circle cx="0" cy="20" r="35" fill="none" stroke="#A8A8A8" stroke-width="2"/>
    <!-- Ribbon -->
    <path d="M-15,-25 L-15,-60 L0,-45 L15,-60 L15,-25" fill="#4169E1" stroke="#1E3A8A" stroke-width="2"/>
    <!-- Number 2 -->
    <text x="0" y="32" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#0a1020" text-anchor="middle">2</text>
  </g>

  <!-- Main text -->
  <text x="256" y="300" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#C0C0C0" text-anchor="middle" filter="url(#glow2)">TURNUVA</text>
  <text x="256" y="350" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#C0C0C0" text-anchor="middle" filter="url(#glow2)">2.İNCİ</text>

  <!-- Ribbon banner -->
  <path d="M156,380 Q256,420 356,380 L356,430 L256,450 L156,430 Z" fill="url(#silverGrad)" stroke="#808080" stroke-width="2"/>
  <text x="256" y="420" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#0a1020" text-anchor="middle">Runner-Up</text>

  <!-- Shimmer effects -->
  <g fill="#C0C0C0" opacity="0.6">
    <circle cx="100" cy="120" r="2"/>
    <circle cx="412" cy="100" r="2"/>
    <circle cx="80" cy="250" r="1"/>
    <circle cx="432" cy="220" r="2"/>
    <circle cx="120" cy="380" r="1"/>
    <circle cx="392" cy="350" r="2"/>
  </g>

  <!-- Season badge -->
  <circle cx="256" cy="480" r="20" fill="url(#silverGrad)" stroke="#808080" stroke-width="2"/>
  <text x="256" y="486" font-family="Arial" font-size="14" font-weight="bold" fill="#0a1020" text-anchor="middle">S1</text>
</svg>