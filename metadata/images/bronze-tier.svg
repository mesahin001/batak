<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CD7F32"/>
      <stop offset="50%" style="stop-color:#A0522D"/>
      <stop offset="100%" style="stop-color:#CD7F32"/>
    </linearGradient>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0f05"/>
      <stop offset="100%" style="stop-color:#1f1408"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad3)"/>

  <!-- Ottoman-style border -->
  <rect x="20" y="20" width="472" height="472" fill="none" stroke="url(#bronzeGrad)" stroke-width="8"/>
  <rect x="30" y="30" width="452" height="452" fill="none" stroke="url(#bronzeGrad)" stroke-width="2"/>

  <!-- Corner decorations - Card suits -->
  <text x="50" y="60" font-size="36" fill="#CD7F32" filter="url(#glow3)">♥</text>
  <text x="440" y="60" font-size="36" fill="#CD7F32" filter="url(#glow3)">♦</text>
  <text x="50" y="470" font-size="36" fill="#CD7F32" filter="url(#glow3)">♣</text>
  <text x="440" y="470" font-size="36" fill="#CD7F32" filter="url(#glow3)">♠</text>

  <!-- Trophy/Medal icon -->
  <g transform="translate(256, 180)">
    <!-- Medal -->
    <circle cx="0" cy="20" r="45" fill="url(#bronzeGrad)" stroke="#8B4513" stroke-width="3"/>
    <circle cx="0" cy="20" r="35" fill="none" stroke="#A0522D" stroke-width="2"/>
    <!-- Ribbon -->
    <path d="M-15,-25 L-15,-60 L0,-45 L15,-60 L15,-25" fill="#D2691E" stroke="#8B4513" stroke-width="2"/>
    <!-- Number 3 -->
    <text x="0" y="32" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#1a0f05" text-anchor="middle">3</text>
  </g>

  <!-- Main text -->
  <text x="256" y="300" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#CD7F32" text-anchor="middle" filter="url(#glow3)">TURNUVA</text>
  <text x="256" y="350" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#CD7F32" text-anchor="middle" filter="url(#glow3)">3.</text>

  <!-- Ribbon banner -->
  <path d="M156,380 Q256,420 356,380 L356,430 L256,450 L156,430 Z" fill="url(#bronzeGrad)" stroke="#8B4513" stroke-width="2"/>
  <text x="256" y="420" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#1a0f05" text-anchor="middle">Third Place</text>

  <!-- Warm particle effects -->
  <g fill="#CD7F32" opacity="0.5">
    <circle cx="100" cy="120" r="2"/>
    <circle cx="412" cy="100" r="2"/>
    <circle cx="80" cy="250" r="1"/>
    <circle cx="432" cy="220" r="2"/>
    <circle cx="120" cy="380" r="1"/>
    <circle cx="392" cy="350" r="2"/>
  </g>

  <!-- Season badge -->
  <circle cx="256" cy="480" r="20" fill="url(#bronzeGrad)" stroke="#8B4513" stroke-width="2"/>
  <text x="256" y="486" font-family="Arial" font-size="14" font-weight="bold" fill="#1a0f05" text-anchor="middle">S1</text>
</svg>