<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFA500"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a0a"/>
      <stop offset="100%" style="stop-color:#2d0a0a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Ottoman-style border -->
  <rect x="20" y="20" width="472" height="472" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
  <rect x="30" y="30" width="452" height="452" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Corner decorations - Card suits -->
  <text x="50" y="60" font-size="36" fill="#FFD700" filter="url(#glow)">♥</text>
  <text x="440" y="60" font-size="36" fill="#FFD700" filter="url(#glow)">♦</text>
  <text x="50" y="470" font-size="36" fill="#FFD700" filter="url(#glow)">♣</text>
  <text x="440" y="470" font-size="36" fill="#FFD700" filter="url(#glow)">♠</text>

  <!-- Trophy icon -->
  <g transform="translate(256, 180)">
    <ellipse cx="0" cy="50" rx="50" ry="15" fill="#B8860B"/>
    <path d="M-30,-40 L-25,10 L25,10 L30,-40 Z" fill="url(#goldGrad)"/>
    <ellipse cx="0" cy="-40" rx="30" ry="10" fill="#FFD700"/>
    <rect x="-8" y="10" width="16" height="30" fill="#B8860B"/>
    <rect x="-20" y="40" width="40" height="8" rx="3" fill="url(#goldGrad)"/>
    <!-- Star on trophy -->
    <polygon points="0,-25 5,-15 18,-15 8,-8 12,5 0,-3 -12,5 -8,-8 -18,-15 -5,-15" fill="#FFF"/>
  </g>

  <!-- Main text -->
  <text x="256" y="300" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#FFD700" text-anchor="middle" filter="url(#glow)">TURNUVA</text>
  <text x="256" y="350" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#FFD700" text-anchor="middle" filter="url(#glow)">KAZANDI</text>

  <!-- Ribbon banner -->
  <path d="M156,380 Q256,420 356,380 L356,430 L256,450 L156,430 Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="2"/>
  <text x="256" y="420" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#1a0a0a" text-anchor="middle">1st Place</text>

  <!-- Sparkle effects -->
  <g fill="#FFD700" opacity="0.8">
    <circle cx="100" cy="120" r="3"/>
    <circle cx="412" cy="100" r="2"/>
    <circle cx="80" cy="250" r="2"/>
    <circle cx="432" cy="220" r="3"/>
    <circle cx="120" cy="380" r="2"/>
    <circle cx="392" cy="350" r="2"/>
  </g>

  <!-- Season badge -->
  <circle cx="256" cy="480" r="20" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="2"/>
  <text x="256" y="486" font-family="Arial" font-size="14" font-weight="bold" fill="#1a0a0a" text-anchor="middle">S1</text>
</svg>